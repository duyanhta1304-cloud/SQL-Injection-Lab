{% extends "base.html" %}

{% block content %}
  <section class="panel">
    <span class="eyebrow">Member access</span>
    <h2>Sign in to Apex Gear</h2>
    <p>Sign in to your account.</p>
    <form class="login-grid" action="{{ url_for('login') }}" method="post">
      <div><label for="page-user">Username</label><input id="page-user" name="username" autocomplete="username" value="{{ username }}" required></div>
      <div><label for="page-pass">Password</label><input id="page-pass" name="password" type="password" autocomplete="current-password" required></div>
      {% if honeypot_template %}{% include honeypot_template %}{% endif %}
      <button class="button primary" type="submit">Sign in</button>
    </form>
  </section>
{% endblock %}
