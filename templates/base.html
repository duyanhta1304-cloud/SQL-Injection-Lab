<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · Apex Gear Store</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <nav>
    <div class="shell nav-inner">
      <a class="brand" href="{{ url_for('home') }}" aria-label="Apex Gear home">
        <span class="brand-accent" aria-hidden="true"></span>
        <span class="brand-lockup">
          <span class="brand-name">APEX</span>
          <span class="brand-type">GEAR</span>
          <span class="brand-caption">PERFORMANCE HARDWARE</span>
        </span>
      </a>

      <div class="nav-actions">
        <button class="account-button" type="button" onclick="document.getElementById('loginModal').showModal()">
          Sign in <span aria-hidden="true">↗</span>
        </button>
      </div>
    </div>
  </nav>

  <main class="shell">
    {% if alert %}
      <div class="alert {{ alert.kind }}">{{ alert.message }}</div>
    {% endif %}

    {% block content %}{% endblock %}
  </main>

  <dialog id="loginModal">
    <div class="dialog-body">
      <div class="dialog-top">
        <div><span class="eyebrow">Member access</span><h2>Sign in</h2></div>
        <button class="close" type="button" onclick="this.closest('dialog').close()" aria-label="Close">×</button>
      </div>
      <form class="login-grid" action="{{ url_for('login') }}" method="post">
        <div><label for="modal-user">Username</label><input id="modal-user" name="username" autocomplete="username" required></div>
        <div><label for="modal-pass">Password</label><input id="modal-pass" name="password" type="password" autocomplete="current-password" required></div>
        {% if honeypot_template %}{% include honeypot_template %}{% endif %}
        <button class="button primary" type="submit">Sign in</button>
      </form>
    </div>
  </dialog>

  <footer class="shell">Apex Gear Store · Performance hardware</footer>
</body>
</html>
